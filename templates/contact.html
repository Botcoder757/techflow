<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - TechFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #080c14; color: #cbd5e1; }
        nav {
            background: rgba(8,12,20,0.95);
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e3a5f;
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
        }
        .logo { font-size: 1.4rem; font-weight: 800; color: #fff; }
        .logo span { color: #60a5fa; }
        nav a { color: #94a3b8; text-decoration: none; margin-left: 32px; font-size: 0.9rem; transition: color 0.2s; }
        nav a:hover { color: #60a5fa; }

        .content { max-width: 600px; margin: 80px auto; padding: 0 20px; }
        h1 { font-size: 2.4rem; color: #f1f5f9; margin-bottom: 10px; font-weight: 800; }
        .sub { color: #64748b; margin-bottom: 40px; font-size: 1rem; }

        .box {
            background: #0d1424;
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 36px 32px;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #1e3a5f;
        }
        .row:last-child { border-bottom: none; padding-bottom: 0; }
        .row:first-child { padding-top: 0; }
        .icon {
            font-size: 1.4rem;
            background: #0f1f35;
            border: 1px solid #1e3a5f;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .info h4 { color: #e2e8f0; font-size: 0.95rem; margin-bottom: 4px; }
        .info p { color: #64748b; font-size: 0.88rem; }

        footer { text-align: center; padding: 28px; font-size: 0.8rem; color: #1e3a5f; border-top: 1px solid #1e3a5f; margin-top: 80px; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Tech<span>Flow</span></div>
        <div>
            <a href="/">Home</a>
            <a href="/services">Services</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </div>
    </nav>
    <div class="content">
        <h1>Contact Us</h1>
        <p class="sub">We'd love to hear from you.</p>
        <div class="box">
            <div class="row">
                <div class="icon">📧</div>
                <div class="info">
                    <h4>Email</h4>
                    <p>hello@techflow.io</p>
                </div>
            </div>
            <div class="row">
                <div class="icon">📞</div>
                <div class="info">
                    <h4>Phone</h4>
                    <p>+1 (800) 123-4567</p>
                </div>
            </div>
            <div class="row">
                <div class="icon">📍</div>
                <div class="info">
                    <h4>Location</h4>
                    <p>San Francisco, CA</p>
                </div>
            </div>
        </div>
    </div>
    <footer>&copy; 2025 TechFlow Inc. All rights reserved.</footer>
</body>
</html>
